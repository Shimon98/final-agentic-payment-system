[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_payments"]

[tool.hatch.build.targets.sdist]
exclude = ["/.codex-local"]

[project]
name = "final-agentic-payment-system"
version = "0.1.0"
description = "Production-inspired educational multi-agent payment simulation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "openai>=2.0",
  "openai-agents>=0.4",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "python-dotenv>=1.0",
]

[project.scripts]
agentic-payments = "agentic_payments.presentation.cli:main"
agentic-payments-notebook = "agentic_payments.presentation.notebook_launcher:main"

[dependency-groups]
dev = [
  "ipykernel>=6.29",
  "jupyterlab>=4.4,<5",
  "mypy>=1.11",
  "nbclient>=0.10",
  "nbformat>=5.10",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "pyyaml>=6.0",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "live_llm: optional live provider test, skipped unless explicitly enabled",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["agentic_payments"]

[tool.coverage.run]
source = ["src/agentic_payments"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
